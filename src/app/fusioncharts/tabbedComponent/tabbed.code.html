<div class="code-view mt-2">
  <div class="card-shadow" style="background: #03040B;">
    <div
      class="code-nav-btns btn-group"
      role="group"
      aria-label="Basic example"
      >
      <button
        type="button"
        class="btn btn-code"
        [ngClass]="cSelected === 'module' && 'selected'"
        (click)="selectCode('module')"
        >
        Module
      </button>
      <button
        type="button"
        class="btn btn-code"
        [ngClass]="cSelected === 'component' && 'selected'"
        (click)="selectCode('component')"
        >
        Component
      </button>
      <button
        type="button"
        class="btn btn-code"
        [ngClass]="cSelected === 'template' && 'selected'"
        (click)="selectCode('template')"
        >
        Template
      </button>
      @if (schemaCode) {
        <button
          type="button"
          class="btn btn-code"
          [ngClass]="cSelected === 'schema' && 'selected'"
          (click)="selectCode('schema')"
          >
          Schema
        </button>
      }
      @if (dataCode) {
        <button
          type="button"
          class="btn btn-code"
          [ngClass]="cSelected === 'data' && 'selected'"
          (click)="selectCode('data')"
          >
          Data
        </button>
      }
    </div>
    <div class="card-body p-0">
      <div class="code-panel">
        <div class="code-panel-header">
          <div id="chartCode">
            <div>
              @switch (cSelected) {
                @case ('module') {
                  <div>
                    <ngx-codemirror
                      [(ngModel)]="moduleCode"
                  [options]="{
                    lineNumbers: true,
                    theme: 'dracula',
                    tabSize: '4',
                    smartIndent: true,
                    readOnly: true,
                    mode: 'javascript'
                  }"
                    ></ngx-codemirror>
                  </div>
                }
                @case ('component') {
                  <div>
                    <ngx-codemirror
                      [(ngModel)]="componentCode"
                  [options]="{
                    lineNumbers: true,
                    theme: 'dracula',
                    tabSize: '4',
                    smartIndent: true,
                    readOnly: true,
                    mode: 'javascript'
                  }"
                    ></ngx-codemirror>
                  </div>
                }
                @case ('template') {
                  <div>
                    <ngx-codemirror
                      [(ngModel)]="templateCode"
                  [options]="{
                    lineNumbers: true,
                    theme: 'dracula',
                    tabSize: '4',
                    smartIndent: true,
                    readOnly: true,
                    mode: 'xml'
                  }"
                    ></ngx-codemirror>
                  </div>
                }
                @case ('schema') {
                  <div>
                    <ngx-codemirror
                      [(ngModel)]="schemaCode"
                  [options]="{
                    lineNumbers: true,
                    theme: 'dracula',
                    tabSize: '4',
                    smartIndent: true,
                    readOnly: true,
                    mode: 'javascript'
                  }"
                    ></ngx-codemirror>
                  </div>
                }
                @case ('data') {
                  <div>
                    <ngx-codemirror
                      [(ngModel)]="dataCode"
                  [options]="{
                    lineNumbers: true,
                    theme: 'dracula',
                    tabSize: '4',
                    smartIndent: true,
                    readOnly: true,
                    mode: 'javascript'
                  }"
                    ></ngx-codemirror>
                  </div>
                }
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
